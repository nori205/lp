<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まずは無料で相談｜のり</title>
<meta name="description" content="タップで答えて、LINEで送るだけ。アプリや自動化でラクにできるか、無料で診断します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --cream:#FDF3CD; --paper:#FFFBEA; --yellow:#FEDB68; --peach:#F3B184; --camel:#DFA67B;
  --ink:#845A3B; --ink-soft:#6B4A33; --brown:#845A3B; --label:#8A5A36;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);line-height:1.8;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
a{color:var(--ink)}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0}
p{margin:0}

/* hero */
.hero{position:relative;padding:calc(56px + env(safe-area-inset-top,0px)) 28px 48px;display:flex;flex-direction:column;gap:24px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;z-index:0}
.hero::before{right:-70px;top:-50px;width:240px;height:240px;background:var(--yellow)}
.hero::after{right:60px;top:120px;width:90px;height:90px;background:var(--peach)}
.hero>*{position:relative;z-index:1}
.id{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.avatar{width:128px;height:128px;border-radius:50%;border:3px solid var(--paper);flex-shrink:0;object-fit:cover}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;width:128px}
.name{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.04em;line-height:1.2;color:var(--brown)}
.role{font-size:13px;font-weight:500;letter-spacing:.08em}
.hero h1{margin-top:28px;font-size:32px;color:var(--brown);line-height:1.35;letter-spacing:.02em}
.lead{font-size:16px;font-weight:500;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{background:var(--paper);border-radius:16px;padding:14px 6px;text-align:center}
.stat small{display:block;font-size:10.5px;font-weight:700;white-space:nowrap;letter-spacing:-.02em}
.stat b{font-family:var(--display);font-weight:900;font-size:26px}
.stat b span{font-size:14px}

/* sections */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--label)}
.doors{background:var(--paper);border-radius:36px 36px 0 0;padding:40px 20px 48px;display:flex;flex-direction:column;gap:20px}
.doors-head{padding:0 8px}
.doors-head h2{font-size:26px;line-height:1.4;margin-top:6px}
.card{background:var(--cream);border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.card.main{background:var(--yellow)}
.num{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:var(--camel)}
.card.main .num{color:var(--ink)}
.card-top{display:flex;align-items:center;justify-content:space-between}
.badge{background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px}
.card h3{font-size:22px;line-height:1.45}
.card p{font-size:15px;line-height:1.85}

.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--cream);text-decoration:none;font-weight:700;font-size:15px;text-align:center}
.btn.strong{min-height:56px;font-size:16px;color:var(--paper)}
.btn.outline{background:transparent;border:2px solid var(--ink);color:var(--ink)}
.menu{background:var(--paper);border-radius:18px;padding:18px 18px;display:flex;flex-direction:column;gap:14px}
.menu-item{display:flex;flex-direction:column;gap:2px}
.menu-item+.menu-item{border-top:1px dashed var(--camel);padding-top:14px}
.menu-item .who{font-size:12px;font-weight:700;color:var(--label)}
.menu-item .what{font-weight:700;font-size:15px;line-height:1.6}
.menu-item .price{font-family:var(--display);font-weight:900;font-size:20px}
.menu-item .fine{font-size:12px;line-height:1.7}
.hint{font-size:12px;text-align:center;margin-top:-6px}
.works-cap{font-size:13px;font-weight:700;color:var(--label);margin-bottom:-6px}
.works{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.works li{background:var(--paper);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center}
.works b{font-size:14px}
.works span{grid-column:1;font-size:12px;line-height:1.6}
.works em{grid-column:2;grid-row:1 / span 2;font-style:normal;font-size:11px;font-weight:700;background:var(--yellow);padding:4px 10px;border-radius:999px;white-space:nowrap}
.works em.paid{background:var(--peach)}
.quiz{display:flex;flex-direction:column;gap:14px}
.q{margin:0;border:0;background:var(--paper);border-radius:20px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.q legend{float:left;width:100%;padding:0;font-weight:700;font-size:15px;line-height:1.6;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.q legend+*{clear:both}
.qn{font-family:var(--display);font-weight:900;font-size:13px;background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 10px}
.q small{font-size:11px;font-weight:700;color:var(--label)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.col{flex-direction:column}
.opt{position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:flex;flex-direction:column;justify-content:center;min-height:44px;padding:8px 14px;border-radius:14px;border:2px solid var(--camel);background:#fff;font-size:13px;font-weight:500;line-height:1.5}
.opt.wide span{font-size:14px;font-weight:700;padding:10px 16px}
.opt em{font-style:normal;font-size:12px;font-weight:500;color:var(--ink-soft)}
.opt input:checked+span{background:var(--yellow);border-color:var(--ink)}
.opt input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.free{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.free textarea,.free input{font:inherit;font-size:16px;font-weight:400;color:var(--ink);border:2px solid var(--camel);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
.free textarea:focus,.free input:focus{outline:none;border-color:var(--ink)}
.err{margin:0;font-size:13px;font-weight:700;color:#8A2A12;min-height:0}
.err:empty{display:none}
button.btn{border:0;width:100%;cursor:pointer;font-family:inherit}
.sublink{font-size:13px;font-weight:700;text-align:center}

.flow{background:var(--peach);padding:48px 28px;display:flex;flex-direction:column;gap:20px}
.flow h2{font-size:24px;line-height:1.45;margin-top:6px}
.flow .eyebrow{color:var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{background:var(--paper);border-radius:18px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start;font-size:15px;line-height:1.75}
.steps .dot{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:700}
.note{font-size:13px;line-height:1.8}

.tools{padding:48px 28px 40px;display:flex;flex-direction:column;gap:18px}
.tools h2{font-size:22px;margin-top:6px}
.tools h3{font-family:var(--body);font-weight:700;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{background:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px}
.chips.ai li{background:var(--yellow);font-weight:500}

.links{padding:8px 20px 40px;display:flex;flex-direction:column;gap:10px}
.links .eyebrow{padding:0 8px 6px}
.link{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 20px;background:var(--paper);border-radius:16px;text-decoration:none;font-weight:700;font-size:14px}

footer{background:var(--ink);color:var(--cream);padding:40px 28px 48px;text-align:center;display:flex;flex-direction:column;gap:16px}
footer .closing{font-family:var(--display);font-weight:900;font-size:20px;line-height:1.6}
footer small{font-size:12px;color:var(--paper)}

@media (min-width:561px){
  body{background:var(--camel)}
  .wrap{background:var(--cream);box-shadow:0 0 0 1px rgba(61,42,30,.08)}
}
.sh-head{padding:calc(32px + env(safe-area-inset-top,0px)) 24px 24px;display:flex;flex-direction:column;gap:16px}
.back{font-size:13px;font-weight:700;text-decoration:none}
.sh-id{display:flex;align-items:center;gap:14px}
.sh-id img{width:64px;height:64px;border-radius:50%;border:3px solid var(--paper)}
.sh-id b{font-family:var(--display);font-weight:900;font-size:20px;color:var(--brown)}
.sh-id small{display:block;font-size:12px}
.sh-head h1{font-size:28px;line-height:1.45;color:var(--brown)}
.sh-lead{font-size:15px;line-height:1.9}
.sh-body{background:var(--peach);border-radius:32px 32px 0 0;padding:28px 20px 48px}
</style>
</head>

    <div><b>のり</b><small>スマホのりかえサポート／AIアプリ開発</small></div>

  <h1>まずは無料で相談</h1>
  <p class="sh-lead">「これ、アプリや自動化でラクにできない？」<br>タップで答えて、LINEで送るだけ。<br>できる・できないと、料金の目安をお返事します。</p>
</header>
<main class="sh-body">
<form class="quiz" id="quiz" novalidate>
    <fieldset class="q">
      <legend><span class="qn">Q1</span>どんなことをラクにしたい？<small>いくつでも</small></legend>
      <div class="opts">
        <label class="opt"><input type="checkbox" name="want" value="毎日・毎月の作業を自動化したい"><span>毎日・毎月の作業を自動化したい</span></label>
        <label class="opt"><input type="checkbox" name="want" value="自分専用のアプリがほしい"><span>自分専用のアプリがほしい</span></label>
        <label class="opt"><input type="checkbox" name="want" value="LINEやスマホに通知がほしい"><span>LINEやスマホに通知がほしい</span></label>
        <label class="opt"><input type="checkbox" name="want" value="表や記録を整理したい"><span>表や記録を整理したい</span></label>
        <label class="opt"><input type="checkbox" name="want" value="SNS・発信をラクにしたい"><span>SNS・発信をラクにしたい</span></label>
      </div>
      <label class="free"><span>ひとことで書くと？（任意）</span><textarea name="wantText" rows="2" placeholder="例：毎月の請求書づくりが大変"></textarea></label>
    </fieldset>

    <fieldset class="q">
      <legend><span class="qn">Q2</span>今はどうやっている？</legend>
      <div class="opts">
        <label class="opt"><input type="radio" name="now" value="手作業・紙"><span>手作業・紙</span></label>
        <label class="opt"><input type="radio" name="now" value="Excel・スプレッドシート"><span>Excel・スプレッドシート</span></label>
        <label class="opt"><input type="radio" name="now" value="アプリやサービス"><span>アプリやサービス</span></label>
        <label class="opt"><input type="radio" name="now" value="まだ何もしていない"><span>まだ何もしていない</span></label>
      </div>
    </fieldset>

    <fieldset class="q">
      <legend><span class="qn">Q3</span>ふだん使っているツールは？<small>いくつでも</small></legend>
      <div class="opts">
        <label class="opt"><input type="checkbox" name="tools" value="LINE"><span>LINE</span></label>
        <label class="opt"><input type="checkbox" name="tools" value="Googleスプレッドシート"><span>Googleスプレッドシート</span></label>
        <label class="opt"><input type="checkbox" name="tools" value="Excel"><span>Excel</span></label>
        <label class="opt"><input type="checkbox" name="tools" value="Googleフォーム"><span>Googleフォーム</span></label>
        <label class="opt"><input type="checkbox" name="tools" value="Notion"><span>Notion</span></label>
        <label class="opt"><input type="checkbox" name="tools" value="Canva"><span>Canva</span></label>
        <label class="opt"><input type="checkbox" name="tools" value="Instagram"><span>Instagram</span></label>
        <label class="opt"><input type="checkbox" name="tools" value="その他"><span>その他</span></label>
      </div>
    </fieldset>

    <fieldset class="q">
      <legend><span class="qn">Q4</span>どうしたい？<small>必須</small></legend>
      <div class="opts col">
        <label class="opt wide"><input type="radio" name="wish" value="自分で作れるようになりたい"><span>自分で作れるようになりたい<em>体験コース 3時間10,000円</em></span></label>
        <label class="opt wide"><input type="radio" name="wish" value="作ってほしい"><span>作ってほしい<em>内容を見て料金をお伝えします</em></span></label>
        <label class="opt wide"><input type="radio" name="wish" value="まだわからない"><span>まだわからない</span></label>
      </div>
    </fieldset>

    <fieldset class="q">
      <legend><span class="qn">Q5</span>SNSのアカウント名<small>必須</small></legend>
      <label class="free"><span>どなたか確認するために使います</span><input type="text" name="sns" placeholder="例：Instagram @nori_05_25" autocomplete="off"></label>
    </fieldset>

    <p class="err" id="quizErr" role="alert"></p>
    <p class="note">※無料でお答えするのは「できる・できない」と「方法・料金の目安」までです。</p>
    <a class="btn strong" id="sendBtn" href="https://line.me/R/ti/p/%40182rnogj" target="_blank" rel="noopener">のりさんに送る</a>
    <p class="hint">LINEが開くので、そのまま送信してください。<br>お返事は数日以内に、のりからLINEで届きます。</p>
  </form>
</main>
<footer>
  <small>© のり</small>

<script>
(function(){
  var f=document.getElementById('quiz'), err=document.getElementById('quizErr'), btn=document.getElementById('sendBtn');
  var BASE='https://line.me/R/oaMessage/%40182rnogj/?';
  function vals(n){return Array.prototype.map.call(f.querySelectorAll('input[name="'+n+'"]:checked'),function(x){return x.value;});}
  function build(){
    var want=vals('want'), wantText=f.elements['wantText'].value.trim(), now=vals('now'), tools=vals('tools'), wish=vals('wish'), sns=f.elements['sns'].value.trim();
    var miss=[];
    if(!want.length && !wantText) miss.push('Q1');
    if(!wish.length) miss.push('Q4');
    if(!sns) miss.push('Q5');
    var w=want.join('／'); if(wantText) w=(w? w+'\n　' : '')+wantText;
    var msg=['【まずは無料で相談】',
      '①やりたいこと：'+w,
      '②今のやり方：'+(now[0]||'未回答'),
      '③使っているツール：'+(tools.join('、')||'未回答'),
      '④ご希望：'+(wish[0]||''),
      '⑤SNS：'+sns,
      '',
      '（のりから数日以内にお返事が届きます）'].join('\n');
    return {miss:miss, url:BASE+encodeURIComponent(msg)};
  }
  function refresh(){ btn.href=build().url; if(!build().miss.length) err.textContent=''; }
  f.addEventListener('change',refresh);
  f.addEventListener('input',refresh);
  f.addEventListener('submit',function(e){e.preventDefault();});
  btn.addEventListener('click',function(e){
    var r=build();
    if(r.miss.length){ e.preventDefault(); err.textContent=r.miss.join('・')+' を答えてください'; if(err.scrollIntoView) err.scrollIntoView({block:'center'}); return; }
    btn.href=r.url;
  });
  refresh();
})();
</script>
